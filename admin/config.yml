# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: DarkerParker/thorud-custom-builders
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/4d0b0356-1046-4359-b494-aa1187527464/pkce
  auth_token_endpoint: /sites/4d0b0356-1046-4359-b494-aa1187527464/token
  gateway_url: https://gateway.decapbridge.com

  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg

site_url: https://thorudcustombuilders.com

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "content"
    label: "Website"
    files:
      - file: "content.json"
        name: "projects"
        label: "Projects, reviews & Instagram"
        description: "Add a project, add a review, or paste in an Instagram feed link. Hit Publish when you're done and the site updates in about a minute."
        fields:
          - label: "Projects"
            name: "projects"
            widget: "list"
            label_singular: "project"
            summary: "{{fields.title}}"
            fields:
              - { label: "Job name", name: "title", widget: "string", hint: "Short. Shows as the headline on the card." }
              - label: "Type of work"
                name: "category"
                widget: "select"
                options:
                  - "Outdoor living"
                  - "Concrete"
                  - "Shops & pole buildings"
                  - "Remodels & repairs"
                hint: "Used for the filter buttons on the Projects page."
              - { label: "Town", name: "location", widget: "string", hint: "e.g. Newberg, OR" }
              - { label: "Year", name: "year", widget: "string", required: false }
              - { label: "Main photo", name: "image", widget: "image", hint: "A phone photo is fine. Landscape works best. This is the one that shows on the cards." }
              - { label: "Caption for the main photo", name: "caption", widget: "string", required: false, hint: "One short line about what's in the shot. Optional." }
              - label: "More photos"
                name: "gallery"
                widget: "list"
                required: false
                label_singular: "photo"
                summary: "{{fields.caption}}"
                hint: "Other shots of the same job. They appear as small thumbnails under the main photo on the Projects page — tap one and it fills the frame."
                fields:
                  - { label: "Photo", name: "image", widget: "image" }
                  - { label: "Caption", name: "caption", widget: "string", required: false, hint: "One short line. Optional, but it's what screen readers and Google read." }
              - { label: "What the job was", name: "blurb", widget: "text", hint: "A sentence or two. Plain and specific beats salesy." }

          - label: "Reviews"
            name: "testimonials"
            widget: "list"
            label_singular: "review"
            summary: "{{fields.who}}"
            fields:
              - { label: "What they said", name: "quote", widget: "text" }
              - { label: "Who said it", name: "who", widget: "string", hint: "e.g. John L. — Milwaukie, OR" }

          - label: "Instagram"
            name: "instagram"
            widget: "object"
            fields:
              - label: "Feed link"
                name: "jsonFeedUrl"
                widget: "string"
                required: false
                hint: "Paste the Behold feed URL here. Leave blank and the site shows a fixed set of photos instead."
